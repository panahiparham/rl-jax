# Cluster settings used by simple-experiments.

[project]
name = "rl-jax"
src_dirs = ["src"]
post_sync = "scripts/install_ale_wheel.sh"

[cluster]
host = "vulcan"
root = "$adam/rl-jax"
account = "aip-mbowling"

[venvs]
cpu = []
gpu = ["cuda", "atari"]

# default slurm settings.
[slurm]
time = "01:00:00"
cpus_per_task = 4
mem_per_cpu = "4G"

# Per-experiment overrides.
[experiments.bench_core]
time = "02:59:00"

[experiments.atari_20m]
time = "02:59:00"
gpus = 1
mem_per_cpu = "8G"

[experiments.atari_200m]
time = "23:59:00"
gpus = 1
mem_per_cpu = "8G"

[experiments.atari_50m]
time = "11:59:00"
gpus = 1
mem_per_cpu = "8G"

[experiments.atari_10m]
time = "2:59:00"
gpus = 1
mem_per_cpu = "8G"

[experiments.atari_reproducibility]
time = "2:59:00"
gpus = 1
mem_per_cpu = "8G"

# Five packed runs (parallel_shards=5) share one GPU through CUDA MPS, with a
# CPU each.
[experiments.atari_100k]
time = "00:59:00"
gpus = 1
mps = true
cpus_per_task = 5
mem_per_cpu = "4G"
